version: '3.8'
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  api:
    build: ./apps/api
    ports:
      - '5000:5000'
    env_file:
      - ./apps/api/.env
    depends_on:
      - mongo
  web:
    build: ./apps/web
    ports:
      - '5173:5173'
    depends_on:
      - api
volumes:
  mongo-data:
