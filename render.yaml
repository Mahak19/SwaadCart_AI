services:
  - type: web
    name: swaadcart-ai
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: WEATHER_CACHE_TTL_MIN
        value: 30
      - key: LOG_LEVEL
        value: info
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: YOUTUBE_API_KEY
        sync: false
